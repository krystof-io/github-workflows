# Reusable workflow for deploying applications via GitOps using Flux
# Location: github-workflows repo at .github/workflows/flux-deploy.yml

name: Flux GitOps Deploy

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
        description: 'Name of the application'
      app_dir_name:
        required: false
        type: string
        default: ''
        description: 'Directory name under cluster_path/target_namespace/, if it differs from app_name (e.g. MCP servers: app_name is the k8s Deployment name "mcp-server-sonarqube" used by validate-flux-deployment.yml, but the manifest directory is just "sonarqube"). Defaults to app_name when omitted — zero behavior change for existing callers.'
      image_tag:
        required: true
        type: string
        description: 'Docker image tag to deploy'
      target_namespace:
        required: true
        type: string
        description: 'Target namespace (dev, prod, etc.)'
      gitops_repo:
        required: true
        type: string
        description: 'GitOps repository (owner/repo)'
      cluster_path:
        required: true
        type: string
        description: 'Path to cluster configuration in GitOps repo'
      cluster_name:
        required: true
        type: string
        description: 'Name of the target cluster'
      commit_message_suffix:
        default: ''
        type: string
        description: 'Additional suffix for commit message'
      manifest_kind:
        required: false
        type: string
        default: 'helm-values'
        description: 'How the image tag is stored: "helm-values" (default, existing behavior — reads/writes .image.tag in app_dir_name/app_name-values.yaml) or "k8s-deployment" (plain Kubernetes manifests — reads/writes the full image ref, repo+tag, on spec.template.spec.containers[0].image in app_dir_name/deployment.yaml). Only "helm-values" was ever exercised before this input existed; adding it changes nothing for a caller that omits it.'
      image_repo:
        required: false
        type: string
        default: ''
        description: 'Full image repository (registry host + path, no tag), required when manifest_kind is "k8s-deployment" — e.g. "docker-private.privpub.krystof.io/krystof-io/mcp-server-sonarqube". Ignored for "helm-values" (the values file already carries repository separately from tag).'
      skip_kustomization_update:
        required: false
        type: boolean
        default: false
        description: 'When true, never touch target_namespace/kustomization.yaml — for a namespace directory (like mcp/) whose resources list is hand-curated in a different style (directory refs with a trailing slash) than the bare-name Helm-app convention apply_changes() assumes. Default false preserves existing behavior for every current caller.'
    secrets:
      CICD_TOKEN:
        required: true
      CICD_USER_EMAIL:
        required: true
      CICD_USER_NAME:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ inputs.cluster_name }})
    runs-on: arc-runners-javadev
    steps:
      - name: Deploy via GitOps
        run: |
          set -e
          
          GITOPS_REPO="${{ inputs.gitops_repo }}"
          APP_NAME="${{ inputs.app_name }}"
          APP_DIR_NAME="${{ inputs.app_dir_name }}"
          NAMESPACE="${{ inputs.target_namespace }}"
          IMAGE_TAG="${{ inputs.image_tag }}"
          IMAGE_REPO="${{ inputs.image_repo }}"
          CLUSTER_PATH="${{ inputs.cluster_path }}"
          CLUSTER_NAME="${{ inputs.cluster_name }}"
          COMMIT_SUFFIX="${{ inputs.commit_message_suffix }}"
          MANIFEST_KIND="${{ inputs.manifest_kind }}"
          SKIP_KUSTOMIZATION="${{ inputs.skip_kustomization_update }}"

          # app_dir_name defaults to app_name — every existing caller (Helm
          # apps, where the directory IS the app name) is unaffected.
          if [ -z "${APP_DIR_NAME}" ]; then
            APP_DIR_NAME="${APP_NAME}"
          fi

          if [ "${MANIFEST_KIND}" = "k8s-deployment" ] && [ -z "${IMAGE_REPO}" ]; then
            echo "❌ manifest_kind=k8s-deployment requires image_repo to be set"
            exit 1
          fi
          
          # Function to apply our specific changes
          apply_changes() {
            echo "🔧 Applying changes for ${APP_NAME} deployment (manifest_kind=${MANIFEST_KIND})..."
            
            # We expect a root kustomization.yaml in the namespace directory, and will add our app dir to the
            # kustomization.yaml if not already present — unless the caller owns that list itself
            # (skip_kustomization_update: true), e.g. a namespace directory like mcp/ whose
            # resources list uses directory-slash entries (- sonarqube/) rather than this
            # function's bare-name convention (- inventory-tracker).
            NAMESPACE_PATH="${CLUSTER_PATH}/${NAMESPACE}"

            if [ "${SKIP_KUSTOMIZATION}" = "true" ]; then
              echo "ℹ️  skip_kustomization_update=true — leaving ${NAMESPACE_PATH}/kustomization.yaml untouched"
            elif [ -f "${NAMESPACE_PATH}/kustomization.yaml" ]; then
              if ! grep -q " - ${APP_DIR_NAME}$" "${NAMESPACE_PATH}/kustomization.yaml"; then
                cd "${NAMESPACE_PATH}"
                # Just add the app dir to the resources list in kustomization.yaml using yq
                yq eval ".resources += [\"${APP_DIR_NAME}\"]" -i kustomization.yaml
                echo "✅ Added ${APP_DIR_NAME} to kustomization at ${NAMESPACE_PATH}/kustomization.yaml"
                cd -
              else 
                echo "ℹ️  ${APP_DIR_NAME} already present in kustomization at ${NAMESPACE_PATH}/kustomization.yaml"
              fi
            else
              echo "⚠️  No kustomization.yaml found at ${NAMESPACE_PATH}"
            fi

            APP_PATH="${CLUSTER_PATH}/${NAMESPACE}/${APP_DIR_NAME}"

            if [ "${MANIFEST_KIND}" = "k8s-deployment" ]; then
              # Plain Kubernetes Deployment manifest — the image ref (repo:tag)
              # lives directly on the container spec, not in a separate Helm
              # values file. One deployment.yaml is assumed to have exactly one
              # container carrying THIS app's image (true for every MCP server
              # today); a multi-container deployment.yaml would need a real
              # container-name match, not index [0], if that ever changes.
              DEPLOYMENT_FILE="${APP_PATH}/deployment.yaml"
              if [ -f "${DEPLOYMENT_FILE}" ]; then
                NEW_IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"
                CURRENT_IMAGE=$(yq eval ".spec.template.spec.containers[0].image" "${DEPLOYMENT_FILE}" 2>/dev/null || echo "none")
                if [ "$CURRENT_IMAGE" = "$NEW_IMAGE" ]; then
                  echo "ℹ️  Image ${NEW_IMAGE} is already current in ${DEPLOYMENT_FILE}"
                  return 0
                fi

                yq eval ".spec.template.spec.containers[0].image = \"${NEW_IMAGE}\"" -i "${DEPLOYMENT_FILE}"
                echo "✅ Updated deployment image at ${DEPLOYMENT_FILE} (${CURRENT_IMAGE} → ${NEW_IMAGE})"
              else
                echo "⚠️  No deployment manifest found at ${DEPLOYMENT_FILE}"
              fi
            else
              # We store our helm values in ${APP_NAME}-values.yaml — filename
              # keys off app_name (the Helm release/values convention), not
              # app_dir_name, since every current helm-values caller has them
              # equal; a future caller with a differing dir name and
              # manifest_kind=helm-values would need this revisited.
              VALUES_FILE="${APP_PATH}/${APP_NAME}-values.yaml"
              if [ -f "${VALUES_FILE}" ]; then
                # Check if tag is already current
                CURRENT_TAG=$(yq eval ".image.tag" "${VALUES_FILE}" 2>/dev/null || echo "none")
                if [ "$CURRENT_TAG" = "$IMAGE_TAG" ]; then
                  echo "ℹ️  Image tag ${IMAGE_TAG} is already current in ${VALUES_FILE}"
                  return 0
                fi

                # Update Helm values
                yq eval ".image.tag = \"${IMAGE_TAG}\"" -i "${VALUES_FILE}"
                echo "✅ Updated Helm values at ${VALUES_FILE} (${CURRENT_TAG} → ${IMAGE_TAG})"
              else
                echo "⚠️  No values file found at ${VALUES_FILE}"
              fi
            fi
          }
          
          # Function for pull request deployment
          deploy_pull_request() {
            echo "🚀 Creating pull request deployment for ${CLUSTER_NAME} cluster"
            
            # Always fetch latest changes first
            echo "📥 Fetching latest changes from GitOps repo..."
            git fetch origin main
            git reset --hard origin/main
            
            # Create feature branch
            BRANCH_NAME="deploy/${APP_NAME}/${IMAGE_TAG}-${CLUSTER_NAME}-$(date +%s)"
            git checkout -b "${BRANCH_NAME}"
            
            # Apply our changes
            apply_changes
            
            # Check if there are any changes to commit
            if git diff --quiet && git diff --cached --quiet; then
              echo "✅ No changes to commit - deployment is already current"
              return 0
            fi
            
            # Show what we're about to commit
            echo "📝 Changes to be committed:"
            git diff --name-status
            
            # Commit and push branch
            git add .
            git commit -m "Deploy ${APP_NAME} ${IMAGE_TAG} to ${NAMESPACE} on ${CLUSTER_NAME}${COMMIT_SUFFIX}

            - Image: ${IMAGE_TAG}
            - Triggered by: ${{ github.actor }}
            - Commit: ${{ github.sha }}
            - Workflow: ${{ github.run_id }}"
            
            git push origin "${BRANCH_NAME}"
            
            # Create Pull Request using GitHub CLI
            export GITHUB_TOKEN="${{ secrets.CICD_TOKEN }}"
            
            echo "📋 Creating pull request..."
            gh pr create \
              --repo "${GITOPS_REPO}" \
              --title "Deploy ${APP_NAME} ${IMAGE_TAG} to ${NAMESPACE} (${CLUSTER_NAME} cluster)" \
              --body "Automated deployment PR for ${APP_NAME} version ${IMAGE_TAG}

            **Cluster**: ${CLUSTER_NAME}
            **Image**: \`${IMAGE_TAG}\`
            **Target**: ${NAMESPACE} namespace in ${CLUSTER_PATH}
            **Triggered by**: ${{ github.actor }}
            **Workflow**: ${{ github.run_id }}${COMMIT_SUFFIX}
            
            This PR will be automatically merged after creation." \
              --base main \
              --head "${BRANCH_NAME}"
            
            echo "🔄 Merging pull request..."
            # Merge the PR immediately and delete the branch
            gh pr merge "${BRANCH_NAME}" --repo "${GITOPS_REPO}" --squash --delete-branch
            
            echo "✅ Created and merged PR for ${CLUSTER_NAME} cluster, branch deleted"
          }
          
          # Clone GitOps repo
          echo "📥 Cloning GitOps repository: ${GITOPS_REPO}"
          git clone https://x-access-token:${{ secrets.CICD_TOKEN }}@github.com/${GITOPS_REPO}.git gitops
          cd gitops
          
          # Configure git
          git config user.name "${{ secrets.CICD_USER_NAME }}"
          git config user.email "${{ secrets.CICD_USER_EMAIL }}"
          
          # Show current state
          echo "📍 Current GitOps repo state:"
          echo "  Branch: $(git branch --show-current)"
          echo "  Last commit: $(git log -1 --oneline)"
          echo "  Target cluster: ${CLUSTER_NAME}"
          echo "  Application: ${APP_NAME}"
          echo "  Image tag: ${IMAGE_TAG}"
          echo "  Namespace: ${NAMESPACE}"
          echo "  Deployment method: pull-request (auto-merge)"
          
          # Execute deployment using pull request method
          if deploy_pull_request; then
            echo "🎉 Pull request deployment completed successfully!"
          else
            echo "💥 Pull request deployment failed"
            exit 1
          fi

      - name: Deployment Summary
        if: always()
        run: |
          APP_NAME="${{ inputs.app_name }}"
          IMAGE_TAG="${{ inputs.image_tag }}"
          NAMESPACE="${{ inputs.target_namespace }}"
          CLUSTER_NAME="${{ inputs.cluster_name }}"
          GITOPS_REPO="${{ inputs.gitops_repo }}"
          CLUSTER_PATH="${{ inputs.cluster_path }}"
          
          # Determine environment type from namespace
          if [[ "${NAMESPACE}" == *"prod"* ]]; then
            ENV_TYPE="🏭 Production"
            ENV_ICON="🏭"
          elif [[ "${NAMESPACE}" == *"dev"* ]]; then
            ENV_TYPE="🔧 Development"
            ENV_ICON="🔧"
          else
            ENV_TYPE="📦 ${NAMESPACE}"
            ENV_ICON="📦"
          fi
          
          echo "## 🚀 GitOps Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Application Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Application**: \`${APP_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${ENV_TYPE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`${NAMESPACE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: \`${CLUSTER_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitOps Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: [\`${GITOPS_REPO}\`](https://github.com/${GITOPS_REPO})" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster Path**: \`${CLUSTER_PATH}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Path**: \`${CLUSTER_PATH}/${NAMESPACE}/${APP_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if deployment was successful based on step outcomes
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "### ✅ Deployment Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **Deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**What happened:**" >> $GITHUB_STEP_SUMMARY
            echo "- Pull request created and automatically merged" >> $GITHUB_STEP_SUMMARY
            echo "- Image tag updated in Helm values file" >> $GITHUB_STEP_SUMMARY
            echo "- Application added to kustomization (if needed)" >> $GITHUB_STEP_SUMMARY
            echo "- Flux will detect changes and deploy automatically" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💥 **Deployment failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the job logs for detailed error information." >> $GITHUB_STEP_SUMMARY
          fi
